name: Build Veyon Windows 64-bit Installer

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-veyon-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows 64-bit Installer
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            base-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-httpserver
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qca-qt6
            mingw-w64-ucrt-x86_64-openldap
            mingw-w64-ucrt-x86_64-cyrus-sasl
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-lzo2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-nsis

      - name: Configure CMake
        run: |
          # Build native interception DLL and import library
          if [ -f "3rdparty/interception/interception.c" ]; then
            echo "Compiling native interception.dll and libinterception.a..."
            gcc -O2 -shared -DINTERCEPTION_EXPORT -I3rdparty/interception -o 3rdparty/interception/interception.dll 3rdparty/interception/interception.c -Wl,--out-implib,3rdparty/interception/libinterception.a
            cp -f 3rdparty/interception/interception.h /ucrt64/include/ 2>/dev/null || true
            cp -f 3rdparty/interception/libinterception.a /ucrt64/lib/ 2>/dev/null || true
            cp -f 3rdparty/interception/interception.dll /ucrt64/bin/ 2>/dev/null || true
          elif [ -f "3rdparty/interception/interception.def" ]; then
            echo "Generating libinterception.a..."
            dlltool -d 3rdparty/interception/interception.def -D interception.dll -l 3rdparty/interception/libinterception.a
            cp -f 3rdparty/interception/interception.h /ucrt64/include/ 2>/dev/null || true
            cp -f 3rdparty/interception/libinterception.a /ucrt64/lib/ 2>/dev/null || true
            cp -f 3rdparty/interception/interception.dll /ucrt64/bin/ 2>/dev/null || true
          fi

          # Fix LibVNC GetComputerName signature for GCC 14+
          if [ -f "3rdparty/libvncserver/src/libvncserver/main.c" ]; then
            sed -i 's/GetComputerName(screen->thisHost/GetComputerNameA(screen->thisHost/g' 3rdparty/libvncserver/src/libvncserver/main.c || true
          fi

          # Clean unused variables causing -Werror in vnckeymap
          if [ -f "plugins/platform/windows/vnckeymap.cpp" ]; then
            sed -i '/childCount =/d' plugins/platform/windows/vnckeymap.cpp || true
          fi

          # Strip unused UltraVNC sources
          .ci/common/strip-ultravnc-sources.sh || true

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON \
            -DWITH_TRANSLATIONS=OFF \
            -DWITH_COMMUNITY_EDITION=ON \
            -DWITH_BUNDLED_LIBVNC=ON \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64 \
            -DVEYON_BUILD_WIN64=ON \
            -DCMAKE_C_FLAGS="-Wno-incompatible-pointer-types -Wno-error" \
            -DCMAKE_CXX_FLAGS="-Wno-error"

      - name: Build Windows Binaries and Installer
        run: |
          ninja -C build -j$(nproc) 2>&1 | tee ninja.log
          cmake --build build --target create-windows-installer 2>&1 | tee -a ninja.log

      - name: Push Failure Log to Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          tail -n 250 ninja.log > build_failure.txt
          git add -f build_failure.txt
          git commit -m "chore: upload build failure log" || true
          git push -f origin build-log || true

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veyon-win64-setup
          path: |
            build/veyon-*-setup.exe
            veyon-*-setup.exe
          if-no-files-found: error

      - name: Create Release on Success
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.11.4-build-${{ github.run_number }}
          name: Veyon 4.11.4 Build ${{ github.run_number }}
          files: |
            build/veyon-*-setup.exe
            veyon-*-setup.exe
